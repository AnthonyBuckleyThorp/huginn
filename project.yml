name: Huginn
options:
  bundleIdPrefix: com.anthony
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  Huginn:
    type: application
    platform: macOS
    sources: [Huginn]
    settings:
      base:
        PRODUCT_NAME: Huginn
        PRODUCT_BUNDLE_IDENTIFIER: com.anthony.huginn
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_LSUIElement: YES
        INFOPLIST_KEY_CFBundleDisplayName: Huginn
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        # Sign every build with the same Apple Development identity so macOS
        # keeps the Screen Recording permission across rebuilds.
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: Apple Development
        DEVELOPMENT_TEAM: T32VYDF43A
        ENABLE_HARDENED_RUNTIME: NO
